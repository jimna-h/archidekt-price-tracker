name: Daily snapshot

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC (7:17am Mountain)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # re-snapshot today whenever the script changes
    branches: [main]
    paths: [track_prices.py, .github/workflows/daily-prices.yml]

permissions:
  contents: write            # needed to commit the updated data
  actions: write             # lets the job keep its own schedule switched on (see last step)

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04     # pinned so the Ubuntu 26 switch (Oct 19, 2026) can't break the job
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot folder
        env:
          ARCHIDEKT_FOLDER_ID: ${{ vars.ARCHIDEKT_FOLDER_ID }}
        run: python track_prices.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            # main may have moved while this ran (e.g. a page edit); replay on top and retry
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi

      # GitHub switches off scheduled workflows after 60 days without repository activity.
      # The daily data commit should already count, but re-enabling the workflow each run
      # makes sure the schedule never lapses.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-prices.yml/enable"
