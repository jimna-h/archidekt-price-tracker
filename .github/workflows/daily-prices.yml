name: Daily deck prices

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC (7:17am Mountain)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated CSV

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot folder
        env:
          ARCHIDEKT_FOLDER_ID: ${{ vars.ARCHIDEKT_FOLDER_ID }}
        run: python track_prices.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Price snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
