name: Check commander art (temporary)
on:
  push:
    branches: [check-art]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > art-check.txt <<'PY'
          import csv, urllib.request
          rows = list(csv.DictReader(open("data/decks.csv")))
          for r in rows:
              for name, i in zip(r["commanders"].split(" | "), r["commander_ids"].split(" | ")):
                  for label, url in (("direct", f"https://cards.scryfall.io/art_crop/front/{i[0]}/{i[1]}/{i}.jpg"),
                                     ("api", f"https://api.scryfall.com/cards/{i}?format=image&version=art_crop")):
                      req = urllib.request.Request(url, headers={"User-Agent": "archidekt-snapshot/1.0", "Accept": "*/*"})
                      try:
                          with urllib.request.urlopen(req, timeout=20) as resp:
                              body = resp.read()
                              print(f"{label}\t{resp.status}\t{resp.headers.get('Content-Type')}\t{len(body)}\t{name}\t{resp.url[:90]}")
                      except Exception as e:
                          print(f"{label}\tERR\t{e}\t\t{name}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-check.txt && git commit -m "art check" && git push
