name: Inspect deck data (temporary)
on:
  push:
    branches: [check-art]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > deck-inspect.txt <<'PY'
          import json, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (archidekt-price-tracker)"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          for deck_id in (5714358, 4279849):
              d = get(f"https://archidekt.com/api/decks/{deck_id}/")
              print("=== deck", deck_id, d.get("name"))
              for k, v in d.items():
                  if k in ("cards",): continue
                  s = json.dumps(v, default=str)
                  print(f"  {k}: {s[:300]}")
              flags = ("gameChanger", "tutor", "extraTurns", "massLandDenial", "twoCardComboSingelton", "twoCardComboIds", "atomicCombos", "potentialCombos")
              for c in d["cards"]:
                  o = c["card"]["oracleCard"]
                  hit = {f: o.get(f) for f in flags if o.get(f)}
                  if hit:
                      print("  CARD", o["name"], "| cats:", c.get("categories"), "|", json.dumps(hit)[:400])
              print("  oracle id example:", d["cards"][0]["card"]["oracleCard"].get("id"), d["cards"][0]["card"]["oracleCard"].get("uid"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached art art-check.txt 2>/dev/null || true
          git add deck-inspect.txt && git commit -m "deck inspect" && git push
