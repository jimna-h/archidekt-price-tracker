name: Check image CORS (temporary)
on:
  push:
    branches: [check-art]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          for u in "https://cards.scryfall.io/art_crop/front/f/6/f6a4b54c-a8fa-464e-a3dd-f3f3a08606f5.jpg" \
                   "https://api.scryfall.com/cards/f6a4b54c-a8fa-464e-a3dd-f3f3a08606f5?format=image&version=art_crop" \
                   "https://fonts.googleapis.com/css2?family=Alegreya:wght@700&display=swap" ; do
            echo "== $u"
            curl -sSI -L -H "Origin: https://jimna-h.github.io" -H "User-Agent: Mozilla/5.0" "$u" | grep -iE "^HTTP|access-control|content-type" 
          done
          } > cors-check.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cors-check.txt && git commit -m "cors check" && git push
